<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">
  <!-- gFET diagram (480 x 360) -->
  <g>
    <!-- horizontal grid guides -->
    <g stroke="#230059" stroke-width="0.5" stroke-dasharray="1 4" stroke-opacity="0.16">
      <line x1="0" y1="80" x2="480" y2="80"/>
      <line x1="0" y1="180" x2="480" y2="180"/>
      <line x1="0" y1="280" x2="480" y2="280"/>
    </g>

    <!-- registration corner marks -->
    <g stroke="#230059" stroke-opacity="0.40" stroke-width="1">
      <path d="M10 10 L10 22 M10 10 L22 10"/>
      <path d="M470 10 L470 22 M470 10 L458 10"/>
      <path d="M10 350 L10 338 M10 350 L22 350"/>
      <path d="M470 350 L470 338 M470 350 L458 350"/>
    </g>

    <!-- plastic substrate -->
    <rect x="40" y="240" width="400" height="80" fill="#e4e1dc" stroke="#230059" stroke-opacity="0.22"/>
    <text x="240" y="285" text-anchor="middle" font-size="11" fill="#8a8790">Plastic substrate</text>

    <!-- source / drain contacts -->
    <rect x="60" y="210" width="80" height="30" fill="#ded9e6" stroke="#230059" stroke-opacity="0.55"/>
    <rect x="340" y="210" width="80" height="30" fill="#ded9e6" stroke="#230059" stroke-opacity="0.55"/>
    <text x="100" y="230" text-anchor="middle" font-size="11" fill="#230059">SOURCE</text>
    <text x="380" y="230" text-anchor="middle" font-size="11" fill="#230059">DRAIN</text>

    <!-- graphene monolayer channel -->
    <line x1="140" y1="210" x2="340" y2="210" stroke="#7c19f6" stroke-width="2"/>
    <circle cx="200" cy="210" r="1.6" fill="#7c19f6"/>
    <circle cx="280" cy="210" r="1.6" fill="#7c19f6"/>
    <text x="240" y="231" text-anchor="middle" font-size="10" fill="#7c19f6">graphene monolayer</text>

    <!-- receptors -->
    <g stroke="#3a3340" stroke-opacity="0.75" stroke-width="1.2" fill="none">
      <path d="M170 210 L170 180 M170 180 L160 168 M170 180 L180 168"/>
      <path d="M210 210 L210 180 M210 180 L200 168 M210 180 L220 168"/>
      <path d="M250 210 L250 180 M250 180 L240 168 M250 180 L260 168"/>
      <path d="M290 210 L290 180 M290 180 L280 168 M290 180 L300 168"/>
      <path d="M330 210 L330 180 M330 180 L320 168 M330 180 L340 168"/>
    </g>

    <!-- bound analytes -->
    <circle cx="210" cy="160" r="6" fill="#b18cf0"/>
    <circle cx="290" cy="158" r="5" fill="#7c19f6"/>
    <circle cx="330" cy="160" r="5" fill="#7c19f6"/>

    <!-- gate scan tick -->
    <rect x="289" y="190" width="2" height="30" fill="#7c19f6" opacity="0.7"/>

    <text x="460" y="145" text-anchor="end" font-size="10" fill="#8a8790">receptor + bound analyte</text>

    <!-- electrolyte interface -->
    <line x1="60" y1="100" x2="420" y2="100" stroke="#7c19f6" stroke-dasharray="2 4" stroke-width="0.8"/>
    <text x="60" y="92" font-size="10" fill="#7c19f6">electrolyte interface</text>

    <!-- gate electrode V_g -->
    <line x1="240" y1="100" x2="240" y2="66" stroke="#230059" stroke-opacity="0.7" stroke-width="1"/>
    <line x1="228" y1="66" x2="252" y2="66" stroke="#230059" stroke-opacity="0.7" stroke-width="2"/>
    <text x="240" y="58" text-anchor="middle" font-size="10" fill="#8a8790">V_g</text>

    <!-- captions -->
    <text x="20" y="40" font-size="10" fill="#230059">FIG. A · gFET cross-section</text>
    <text x="460" y="40" text-anchor="end" font-size="10" fill="#9a9790">scale: schematic</text>
  </g>
</svg>
